services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: developer-portfolio-frontend-prod
    container_name: portfolio-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL}

  backend:
    build:
      context: ./backend
    image: developer-portfolio-backend-prod
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}

  nginx:
    image: nginx:stable-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - backend

  database:
    image: mysql:8.4
    container_name: portfolio-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - portfolio_mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

volumes:
  portfolio_mysql_data:
