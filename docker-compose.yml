services:
  frontend:
    build:
      context: ./frontend
    container_name: portfolio-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      
  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app